<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工事日報</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111}
main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 10px #0002}
h1{margin:0 0 20px}label{display:block;font-weight:700;margin-top:16px}
input,select,textarea{box-sizing:border-box;width:100%;font-size:18px;padding:12px;margin-top:6px;border:1px solid #aaa;border-radius:8px}
textarea{min-height:100px}.primary{width:100%;font-size:20px;font-weight:700;padding:15px;margin-top:24px;border:0;border-radius:10px;background:#222;color:#fff}
.link{display:block;text-align:center;margin-top:18px;font-size:18px}
</style></head><body><main><div class="card">
<h1>工事日報</h1>
<form method="post" action="/submit">
<label>日付<input type="date" name="work_date" value="{{ today }}" required></label>
<label>天気<select name="weather"><option>晴</option><option>曇</option><option>雨</option><option>雪</option></select></label>
<label>業者名<input name="company" required></label>
<label>作業内容<textarea name="work" required></textarea></label>
<label>人数<input type="number" name="people" min="0" inputmode="numeric"></label>
<label>備考<textarea name="note"></textarea></label>
<button class="primary" type="submit">日報を送信</button>
</form>
<a class="link" href="/reports">送信済み日報を見る</a>
</div></main></body></html>
